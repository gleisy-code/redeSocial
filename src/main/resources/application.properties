spring.application.name=redeSocial
spring.neo4j.uri=bolt://localhost:7687
spring.neo4j.authentication.username=neo4j
spring.neo4j.authentication.password=secret123

# Oculta os logs de Warning do Spring Data Neo4j (Cypher deprecation)
logging.level.org.springframework.data.neo4j.cypher.deprecation=ERROR

# Garante que os logs gerais do Neo4j fiquem silenciosos
logging.level.org.springframework.data.neo4j=ERROR

# Desativa o log das consultas Cypher executadas pelo Neo4jClient
logging.level.org.springframework.data.neo4j.cypher=OFF